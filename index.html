<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surya Pramuditya Prayogi - Portfolio</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* CSS RESET & VARIABLES */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            scroll-behavior: smooth;
        }

        :root {
            --bg-main: #08080a;
            --bg-surface: #121216;
            --bg-surface-elevated: #1a1a20;
            --accent-gold: #d4af37;
            --accent-gold-light: #f3e5ab;
            --accent-gold-dim: rgba(212, 175, 55, 0.15);
            --accent-gold-glow: rgba(212, 175, 55, 0.35);
            --text-light: #f8f8f8;
            --text-muted: #a0a0a8;
            --glass-bg: rgba(8, 8, 10, 0.85);
            --glass-border: rgba(212, 175, 55, 0.2);
            
            --font-heading: 'Playfair Display', serif;
            --font-body: 'Poppins', sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-light);
            font-family: var(--font-body);
            overflow-x: hidden;
            line-height: 1.6;
        }

        /* FALLBACK REVEAL ANIMATION FOR VERCEL PREVIEW */
        .reveal {
            opacity: 1;
            transform: translateY(0);
            transition: opacity 0.8s cubic-bezier(0.25, 1, 0.5, 1), transform 0.8s cubic-bezier(0.25, 1, 0.5, 1);
        }

        js-enabled .reveal {
            opacity: 0;
            transform: translateY(30px);
        }

        js-enabled .reveal.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* FLOATING NAVBAR */
        header {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 1200px;
            z-index: 1000;
        }

        nav {
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            border-radius: 50px;
            padding: 12px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .logo {
            font-family: var(--font-heading);
            font-size: 22px;
            font-weight: 700;
            color: var(--text-light);
            text-decoration: none;
            letter-spacing: 1px;
        }

        .logo span { color: var(--accent-gold); }

        .nav-links {
            display: flex;
            gap: 25px;
            list-style: none;
            align-items: center;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--text-muted);
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: all 0.3s ease;
            position: relative;
            padding: 5px 0;
        }

        .nav-links a:hover, .nav-links a.active {
            color: var(--accent-gold);
        }

        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--accent-gold);
            transition: width 0.3s ease;
        }

        .nav-links a.active::after, .nav-links a:hover::after {
            width: 100%;
        }

        .nav-btn {
            padding: 8px 20px !important;
            border: 1px solid var(--accent-gold);
            border-radius: 20px;
            color: var(--accent-gold) !important;
            transition: all 0.3s ease !important;
        }

        .nav-btn::after { display: none !important; }

        .nav-btn:hover {
            background: var(--accent-gold);
            color: var(--bg-main) !important;
            box-shadow: 0 0 15px var(--accent-gold-glow);
        }

        .menu-toggle {
            display: none;
            font-size: 22px;
            color: var(--accent-gold);
            cursor: pointer;
        }

        /* SECTIONS GENERAL */
        section {
            min-height: 100vh;
            padding: 140px 8% 80px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .section-header {
            text-align: center;
            margin-bottom: 60px;
        }

        .section-subtitle {
            color: var(--accent-gold);
            font-size: 12px;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 8px;
            display: block;
        }

        .section-title {
            font-family: var(--font-heading);
            font-size: 36px;
            font-weight: 400;
            color: var(--text-light);
        }

        /* HERO SECTION */
        #home {
            background: radial-gradient(circle at 50% 40%, rgba(212, 175, 55, 0.08) 0%, transparent 60%);
            text-align: center;
            align-items: center;
        }

        .hero-badge {
            display: inline-block;
            padding: 6px 18px;
            background: var(--accent-gold-dim);
            border: 1px solid var(--glass-border);
            border-radius: 30px;
            color: var(--accent-gold);
            font-size: 12px;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 25px;
        }

        .hero-title {
            font-family: var(--font-heading);
            font-size: 4rem;
            line-height: 1.15;
            margin-bottom: 15px;
            font-weight: 400;
        }

        .hero-subtitle {
            font-size: 1.1rem;
            color: var(--text-muted);
            letter-spacing: 2px;
            margin-bottom: 35px;
        }

        .btn-group {
            display: flex;
            gap: 20px;
            justify-content: center;
        }

        .btn-primary {
            padding: 14px 32px;
            background: var(--accent-gold);
            color: var(--bg-main);
            border: 1px solid var(--accent-gold);
            text-decoration: none;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            border-radius: 4px;
            transition: all 0.3s ease;
        }

        .btn-primary:hover {
            box-shadow: 0 0 25px var(--accent-gold-glow);
            transform: translateY(-2px);
        }

        .btn-secondary {
            padding: 14px 32px;
            background: transparent;
            color: var(--text-light);
            border: 1px solid rgba(255, 255, 255, 0.2);
            text-decoration: none;
            font-size: 12px;
            font-weight: 500;
            letter-spacing: 2px;
            text-transform: uppercase;
            border-radius: 4px;
            transition: all 0.3s ease;
        }

        .btn-secondary:hover {
            border-color: var(--accent-gold);
            color: var(--accent-gold);
        }

        /* ABOUT SECTION */
        .about-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 50px;
            align-items: center;
            max-width: 1100px;
            margin: 0 auto;
        }

        .about-text p {
            color: var(--text-muted);
            margin-bottom: 20px;
            font-size: 1rem;
        }

        .about-stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .stat-card {
            background: var(--bg-surface);
            border: 1px solid var(--glass-border);
            padding: 25px;
            border-radius: 8px;
            text-align: center;
        }

        .stat-number {
            font-family: var(--font-heading);
            font-size: 36px;
            color: var(--accent-gold);
            display: block;
        }

        .stat-label {
            font-size: 12px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* SKILLS SECTION */
        .skills-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
            max-width: 1100px;
            margin: 0 auto;
            width: 100%;
        }

        .skill-card {
            background: var(--bg-surface);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 30px;
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .skill-card:hover {
            border-color: var(--accent-gold);
            transform: translateY(-5px);
        }

        .skill-icon {
            font-size: 28px;
            color: var(--accent-gold);
            margin-bottom: 15px;
        }

        .skill-title {
            font-size: 18px;
            margin-bottom: 20px;
        }

        .progress-bar-container {
            margin-bottom: 15px;
        }

        .progress-info {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            margin-bottom: 5px;
            color: var(--text-muted);
        }

        .progress-bar {
            height: 6px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 3px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: var(--accent-gold);
            width: 0%;
            transition: width 1s ease-in-out;
        }

        /* EXPERIENCE SECTION */
        .timeline {
            max-width: 800px;
            margin: 0 auto;
            position: relative;
            padding-left: 30px;
        }

        .timeline::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 2px;
            background: var(--glass-border);
        }

        .timeline-item {
            position: relative;
            margin-bottom: 40px;
        }

        .timeline-item::before {
            content: '';
            position: absolute;
            left: -35px;
            top: 5px;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--accent-gold);
            box-shadow: 0 0 10px var(--accent-gold);
        }

        .timeline-date {
            font-size: 12px;
            color: var(--accent-gold);
            letter-spacing: 2px;
            margin-bottom: 5px;
        }

        .timeline-title {
            font-size: 18px;
            margin-bottom: 5px;
        }

        .timeline-company {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 10px;
        }

        /* PROJECTS SECTION */
        .project-filters {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 8px 20px;
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-muted);
            font-size: 12px;
            letter-spacing: 1px;
            text-transform: uppercase;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .filter-btn.active, .filter-btn:hover {
            border-color: var(--accent-gold);
            color: var(--accent-gold);
            background: var(--accent-gold-dim);
        }

        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            max-width: 1100px;
            margin: 0 auto;
            width: 100%;
        }

        .project-card {
            background: var(--bg-surface);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            padding: 30px;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .project-card:hover {
            border-color: var(--accent-gold);
            transform: translateY(-5px);
        }

        .project-category {
            font-size: 11px;
            color: var(--accent-gold);
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .project-card h3 {
            font-family: var(--font-heading);
            font-size: 22px;
            margin-bottom: 12px;
            font-weight: 400;
        }

        .project-card p {
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 20px;
        }

        .project-btn {
            color: var(--accent-gold);
            background: none;
            border: none;
            font-size: 12px;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 0;
            font-weight: 600;
        }

        /* SERVICES SECTION */
        .services-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 25px;
            max-width: 1100px;
            margin: 0 auto;
            width: 100%;
        }

        .service-card {
            background: var(--bg-surface);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 30px;
            border-radius: 8px;
            text-align: center;
            transition: all 0.3s ease;
        }

        .service-card:hover {
            border-color: var(--accent-gold);
            background: var(--bg-surface-elevated);
        }

        .service-icon {
            font-size: 32px;
            color: var(--accent-gold);
            margin-bottom: 20px;
        }

        /* CONTACT SECTION */
        .contact-container {
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
        }

        .contact-boxes {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 40px;
        }

        .contact-box {
            background: var(--bg-surface);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 25px;
            text-align: center;
            border-radius: 8px;
            text-decoration: none;
            color: var(--text-light);
            transition: all 0.3s ease;
        }

        .contact-box:hover {
            border-color: var(--accent-gold);
            background: var(--accent-gold-dim);
        }

        .contact-box i {
            font-size: 28px;
            color: var(--accent-gold);
            margin-bottom: 10px;
        }

        .contact-form {
            background: var(--bg-surface);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 40px;
            border-radius: 8px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-input {
            width: 100%;
            padding: 14px 18px;
            background: var(--bg-main);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-light);
            border-radius: 4px;
            font-family: var(--font-body);
            font-size: 14px;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--accent-gold);
        }

        /* MODAL */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-content {
            background: var(--bg-surface);
            border: 1px solid var(--accent-gold);
            padding: 40px;
            border-radius: 8px;
            max-width: 600px;
            width: 100%;
            position: relative;
        }

        .close-modal {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 24px;
            color: var(--text-muted);
            cursor: pointer;
        }

        /* TOAST */
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: var(--accent-gold);
            color: var(--bg-main);
            padding: 15px 25px;
            border-radius: 4px;
            font-weight: 600;
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.3s ease;
            z-index: 3000;
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        /* FOOTER */
        footer {
            text-align: center;
            padding: 30px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 13px;
            color: var(--text-muted);
        }

        /* RESPONSIVE */
        @media (max-width: 900px) {
            .hero-title { font-size: 2.8rem; }
            .about-grid { grid-template-columns: 1fr; }
            .contact-boxes { grid-template-columns: 1fr; }
            .menu-toggle { display: block; }

            .nav-links {
                position: fixed;
                top: 80px;
                left: 0;
                width: 100%;
                background: var(--bg-surface);
                flex-direction: column;
                padding: 30px;
                gap: 20px;
                transform: translateY(-150%);
                transition: transform 0.4s ease;
                border-bottom: 1px solid var(--glass-border);
            }

            .nav-links.active {
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>

    <!-- HEADER / NAVIGATION -->
    <header>
        <nav>
            <a href="#home" class="logo">Surya<span>.</span></a>
            <ul class="nav-links" id="nav-links">
                <li><a href="#home" class="active">Home</a></li>
                <li><a href="#about">About</a></li>
                <li><a href="#skills">Skills</a></li>
                <li><a href="#experience">Experience</a></li>
                <li><a href="#projects">Projects</a></li>
                <li><a href="#services">Services</a></li>
                <li><a href="#contact" class="nav-btn">Hire Me</a></li>
            </ul>
            <div class="menu-toggle" id="menu-toggle">
                <i class="fas fa-bars"></i>
            </div>
        </nav>
    </header>

    <!-- HOME SECTION -->
    <section id="home">
        <span class="hero-badge reveal">Portfolio</span>
        <h1 class="hero-title reveal">Surya Pramuditya Prayogi</h1>
        <p class="hero-subtitle reveal">Software Engineering & IoT Developer</p>
        <div class="btn-group reveal">
            <a href="#projects" class="btn-primary">View Projects</a>
            <a href="#contact" class="btn-secondary">Contact Me</a
